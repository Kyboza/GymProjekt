<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member 24 Hours</title>
    <link rel="stylesheet" href="../css/style.css" type="text/css">
    <link rel="icon" href="../img/favicon.png" sizes="64x64" type="image/png">
    <meta name="author" content="Johan Clifford">
    <meta name="description" content="Open hours for the Member24 gym">
    <script src="../js/dropdown.js" defer></script>
    <script src="../js/carousel.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="header__row_container">
            <h1 class="header__h1">
                <a href="index.html" alt="Mainpage" tabindex="0">Member 24</a>
            </h1>
            <!-- Dropdown icon -->
            <button class="header__dropdown_icon_container" id="hamburger" tabindex="0">
                <div class="header__dropdown_icon" id="icon"></div>
            </button>
        </div>
        <!-- Navigation -->
        <nav class="header__nav">
            <ul class="header__ul">
                <li><a href="index.html" tabindex="0">Main</a></li>
                <li><a href="index.html#main" tabindex="0">Become Member</a></li>
                <li><a href="contact.html" tabindex="0">Contact</a></li>
                <li><a href="About.html" tabindex="0">About</a></li>
            </ul>
        </nav>
        <!-- Dropdown Menu -->
        <ul class="header__dropdown_ul" id="dropdownMenu" aria-hidden="true">
            <li class="header__dropdown_li">
                <a href="#main" class="header__dropdown_anchor" tabindex="-1">Member</a>
            </li>
            <li class="header__dropdown_li">
                <a href="hours.html" class="header__dropdown_anchor" tabindex="-1">Hours</a>
            </li>
            <li class="header__dropdown_li">
                <a href="contact.html" class="header__dropdown_anchor" tabindex="-1">Contact</a>
            </li>
            <li class="header__dropdown_li">
                <a href="About.html" class="header__dropdown_anchor" tabindex="-1">About</a>
            </li>
        </ul>
    </header>
    
    <!-- Hero Section (Image Carousel) -->
    <section class="hero">
        <h2 class="hero__h2">1st Class Gym</h2>
        <figure>
            <div class="hero__carousel">
                <ul class="hero__img_container" data-slides id="carousel-container">
                    <li>
                        <img class="hero__img" data-active src="../img/Member24Main1024x683.jpg" alt="Image 1" title="Image 1">
                        <figcaption class="offscreen">Member 24 Image 1</figcaption>
                    </li>
                    <li>
                        <img class="hero__img" src="../img/Member24Contact1500x1000.jpg" alt="Image 2" title="Image 2">
                        <figcaption class="offscreen">Member 24 Image 2</figcaption>
                    </li>
                    <li>
                        <img class="hero__img" src="../img/Member24About1500x1000.jpg" alt="Image 3" title="Image 3">
                        <figcaption class="offscreen">Member 24 Image</figcaption>
                    </li>
                </ul>
                <div class="hero__carousel_button_container">
                    <button class="hero__carousel_button" tabindex="0">
                        <img class="hero__carousel_button_img" src="../img/left.png" alt="previous image" title="previous image" id="previous">
                    </button>
                    <button class="hero__carousel_button" tabindex="0">
                        <img class="hero__carousel_button_img" src="../img/right.png" alt="next image" title="next image" id="next">
                    </button>
                </div>
            </div>
        </figure>
    </section>
    
    <!-- Opening Hours Section -->
    <main class="main">
        <article class="main__article">
            <h2>Staffed</h2>
            <p>We are open <strong>24/7!</strong></p>
            <dl>
                <dt>Monday-Friday</dt>
                <dd>10am-8pm</dd>
                <dt>Saturday-Sunday</dt>
                <dd>No Staff</dd>
            </dl>
        </article>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <span class="nowrap">Copyright &copy;</span>
        <span class="nowrap">Member 24</span>
    </footer>
</body>
</html>
